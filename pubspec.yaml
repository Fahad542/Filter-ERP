name: filter_service_providers
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+4

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.0.1
  shared_preferences: ^2.5.4
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  share_plus: ^12.0.1
  fl_chart: ^1.1.1
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_typeahead: ^5.2.0
  excel: ^4.0.0
  open_file: ^3.3.2
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
  socket_io_client: ^2.0.3+1
  translator: ^1.0.4+1
  esc_pos_utils_plus: ^2.0.4

  image: ^4.3.0
  qr_flutter: ^4.1.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  mobile_scanner: ^7.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:
  generate: true


  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf
    - assets/google_fonts/

  fonts:
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/google_fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/google_fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/google_fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Poppins-Bold.ttf
          weight: 800
        - asset: assets/google_fonts/Poppins-Bold.ttf
          weight: 900

